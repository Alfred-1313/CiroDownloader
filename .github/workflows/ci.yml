name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_sqlite, pcntl, posix
          coverage: none

      - name: Run PHP tests
        run: |
          php tests/run.php
          php tests/cookies.php
          php tests/cookie_manager.php
          php tests/instagram.php
          php tests/article_transport.php
          php tests/jobs.php
          php tests/customization.php
          php tests/personalization_recovery.php
          php tests/personalization_sections.php
          php tests/personalization_scope.php
          php tests/admin_keyboard.php
          php tests/groups.php
          php tests/group_updates.php
          php tests/posters.php
          php tests/ux_fixes.php
          php tests/quality_waiting.php
          php tests/processing_limits.php

      - name: Install FFmpeg for media regression tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify Instagram extraction and article publishing
        run: |
          python3 -m venv /tmp/ciro-gallery-tests
          /tmp/ciro-gallery-tests/bin/pip install 'gallery-dl==1.32.19'
          GALLERY_DL_PYTHON=/tmp/ciro-gallery-tests/bin/python php tests/instagram_media.php

      - name: Verify portrait video conversion and multipart upload
        run: |
          php tests/parallel_worker.php
          php tests/parallel_worker.php --group
          php tests/media.php
          php tests/downloader_access.php
          php tests/quality_worker.php --anonymous
          php tests/quality_worker.php --anonymous --audio
          php tests/quality_worker.php --anonymous --group
          php tests/parallel_worker.php --anonymous
          php tests/quality_worker.php
          php tests/quality_worker.php --audio
          php tests/quality_worker.php --custom-parts
          php tests/quality_worker.php --audio --custom-parts
          php tests/quality_worker.php --shorts
          php tests/quality_worker.php --legacy-caption
          php tests/quality_worker.php --cleanup-failure
          php tests/quality_worker.php --group
          php tests/quality_worker.php --group --audio
          php tests/quality_worker.php --group --audio --custom-parts
          php tests/quality_worker.php --group --disabled
          php tests/audio.php
          php tests/large_upload.php
          php tests/disk_space.php

      - name: Check PHP syntax
        run: find src bin tests -name '*.php' -exec php -l {} +

      - name: Check shell syntax
        run: |
          for script in install.sh manager.sh setup.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
          bash tests/manager.sh

      - name: Verify host updater backup and recovery
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet

      - name: Build production image
        run: |
          chmod -R go-rwx src bin resources
          docker build --tag ciro-downloader:ci .

      - name: Verify runtime can read code from a restrictive checkout
        run: |
          test "$(docker run --rm --entrypoint id ciro-downloader:ci -u)" = 10001
          docker run --rm --read-only --entrypoint php ciro-downloader:ci -r '
            foreach (["Core.php", "Bot.php", "Download.php", "Worker.php"] as $file) require "/app/src/".$file;
            if (!extension_loaded("pcntl") || !extension_loaded("posix")) throw new RuntimeException("Worker process extensions are missing");
            foreach (glob("/app/bin/*.php") as $file) {
              if (!is_readable($file)) throw new RuntimeException("Unreadable entrypoint: ".$file);
            }
            echo "Runtime source and entrypoints are readable.\n";
          '

      - name: Verify private backup and restore on an actual Docker volume
        run: python3 -B tests/integration_maintenance.py

      - name: Verify local API cookie paths are bounded
        run: |
          sudo mkdir -p /telegram-api/test
          printf 'private-test-data' | sudo tee /telegram-api/test/cookies.txt >/dev/null
          sudo ln -s /etc/passwd /telegram-api/test/outside
          php tests/local_api_paths.php

  local-bot-api:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned official local Bot API
        run: docker build --build-arg BUILD_JOBS=3 -f Dockerfile.telegram-api -t ciro-telegram-api:test .
      - name: Verify the server starts and accepts connections
        run: |
          docker run -d --name local-api-test -p 127.0.0.1:18081:8081 -e TELEGRAM_API_ID=123456 -e TELEGRAM_API_HASH=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa ciro-telegram-api:test
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:18081/; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' local-api-test)" != true ]; then docker logs local-api-test; exit 1; fi
            sleep 1
          done
          docker logs local-api-test
          exit 1

