name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_sqlite
          coverage: none

      - name: Run PHP tests
        run: |
          php tests/run.php
          php tests/cookies.php
          php tests/jobs.php
          php tests/customization.php
          php tests/posters.php

      - name: Install FFmpeg for media regression tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify portrait video conversion and multipart upload
        run: |
          php tests/media.php
          php tests/quality_worker.php
          php tests/quality_worker.php --audio
          php tests/quality_worker.php --shorts
          php tests/audio.php

      - name: Check PHP syntax
        run: find src bin tests -name '*.php' -exec php -l {} +

      - name: Check shell syntax
        run: for script in install.sh manager.sh setup.sh scripts/*.sh; do bash -n "$script"; done

      - name: Verify host updater backup and recovery
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet

      - name: Build production image
        run: |
          chmod -R go-rwx src bin resources
          docker build --tag ciro-downloader:ci .

      - name: Verify runtime can read code from a restrictive checkout
        run: |
          test "$(docker run --rm --entrypoint id ciro-downloader:ci -u)" = 10001
          docker run --rm --read-only --entrypoint php ciro-downloader:ci -r '
            foreach (["Core.php", "Bot.php", "Download.php"] as $file) require "/app/src/".$file;
            foreach (glob("/app/bin/*.php") as $file) {
              if (!is_readable($file)) throw new RuntimeException("Unreadable entrypoint: ".$file);
            }
            echo "Runtime source and entrypoints are readable.\n";
          '
