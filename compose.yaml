name: ciro-downloader
x-common: &common
  build:
    context: .
    args:
      YOUTUBE_POT_PLUGIN: ${YOUTUBE_POT_PLUGIN:-0}
  image: ciro-downloader:local
  env_file: .env
  restart: unless-stopped
  init: true
  read_only: true
  volumes:
    - data:/app/storage
    - telegram-api-data:/telegram-api:ro
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: 768m
  cpus: 1.0
  pids_limit: 128
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  bot:
    <<: *common
    command: [php, bin/bot.php]
  worker:
    <<: *common
    command: [php, bin/worker.php]
  # The live radio: plays queued songs into the live stream of a group or channel (see docs/radio.md).
  # Start it with: docker compose --profile radio up -d radio
  radio:
    <<: *common
    profiles: [radio]
    command: [php, bin/radio.php]
    cpus: 0.75
    mem_limit: 512m
  # Optional PO Token provider for YouTube. Start it with: docker compose --profile pot up -d
  # and set YOUTUBE_POT_PLUGIN=1 and YOUTUBE_POT_URL=http://pot:4416 in .env. No port is published.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    profiles: [pot]
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  data:
  telegram-api-data:
    name: ciro-downloader-telegram-api-data

